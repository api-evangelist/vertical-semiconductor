name: Vertical Semiconductor
description: 'Vertical Semiconductor is an MIT spinout developing next-generation vertical
  Gallium Nitride (GaN) power devices for AI data centers and grid infrastructure. Built on
  a decade of research from MIT''s Palacios Group, its vertical GaN transistors push energy
  conversion closer to the chip with less power loss and heat, targeting high-voltage
  applications from 100V to over 2kV. The company claims up to 30% higher efficiency, a 50%
  smaller power footprint, and 10% lower total cost of ownership versus silicon, and has
  demonstrated its platform on 8-inch wafers using standard silicon CMOS manufacturing. It is
  a hardware/deep-tech power-electronics company with no public API, developer portal, SDK, or
  OpenAPI surface. Backed by Playground Global.'
